apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-bot-netpol
  namespace: fraud-bot-prod
spec:
  podSelector:
    matchLabels:
      app: fraud-bot
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
        - protocol: TCP
      port: 8080
  egress:
    - to:
        - namespaceSelector: {}
    ports:
        - port: 53
      protocol: UDP
 

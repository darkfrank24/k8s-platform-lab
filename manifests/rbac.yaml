apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-bot-sa
  namespace: fraud-bot-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fraud-bot-role
  namespace: fraud-bot-prod
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fraud-bot-rolebinding
  namespace: fraud-bot-prod
subjects:
- kind: ServiceAccount
  name: fraud-bot-sa
  namespace: fraud-bot-prod
roleRef:
  kind: Role
  name: fraud-bot-role
  apiGroup: rbac.authorization.k8s.io
 
